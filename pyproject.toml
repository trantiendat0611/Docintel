[project]
name = "docintel"
version = "0.1.0"
description = "Document Intelligence System: Vietnamese document Q&A with citations and structured extraction"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "celery>=5.6.3",
    "docling[easyocr]>=2.142.1",
    "fastapi>=0.162.0",
    "jiwer>=4.0.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "reportlab>=5.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Test chạy Docling/OCR thật mất vài phút và cần tải model, nên không chạy mặc định
# (và không chạy trong CI). Chạy riêng bằng: uv run pytest -m slow
markers = ["slow: chạy parser và OCR thật"]
addopts = "-m 'not slow'"
